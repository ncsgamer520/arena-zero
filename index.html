<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Zero</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #status {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #00ff00;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 12px;
      border-radius: 5px;
      font-weight: bold;
      z-index: 10;
    }
  </style>

  <!-- Babylon.js Core & GLTF Loader -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

  <div id="status">Loading 3D Character...</div>
  <canvas id="renderCanvas"></canvas>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const statusText = document.getElementById("status");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = function () {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.15, 0.15, 0.2);

      // Camera positioned close to character center
      const camera = new BABYLON.ArcRotateCamera("camera", 0, Math.PI / 3, 5, new BABYLON.Vector3(0, 1, 0), scene);
      camera.attachControl(canvas, true);

      // Lighting
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 1.0;

      // Arena Floor
      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 20, height: 20 }, scene);
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.35);
      ground.material = groundMat;

      // Load Model
      BABYLON.SceneLoader.ImportMeshAsync("", "", "Superhero_Male_FullBody.gltf", scene).then((result) => {
        statusText.innerText = "Character Loaded!";
        statusText.style.color = "#00ff00";
        
        const character = result.meshes[0];
        character.position = new BABYLON.Vector3(0, 0, 0);
        character.scaling = new BABYLON.Vector3(1, 1, 1);
        camera.target = character.position;
      }).catch((err) => {
        statusText.innerText = "Error Loading Model: Check Filename";
        statusText.style.color = "#ff4444";
        console.error("Loader Error:", err);
      });

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(function () {
      scene.render();
    });

    window.addEventListener("resize", function () {
      engine.resize();
    });
  </script>
</body>
</html>
