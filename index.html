<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Zero</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #status {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #00ff00;
      background: rgba(0, 0, 0, 0.85);
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      z-index: 10;
      max-width: 90%;
      word-wrap: break-word;
    }
  </style>

  <!-- Babylon.js Core & Loaders -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

  <div id="status">Initializing Scene...</div>
  <canvas id="renderCanvas"></canvas>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const statusText = document.getElementById("status");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = function () {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.15, 0.15, 0.2);

      // Camera
      const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 5, new BABYLON.Vector3(0, 1, 0), scene);
      camera.attachControl(canvas, true);

      // Light
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 1.2;

      // Arena Ground
      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 20, height: 20 }, scene);
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.3, 0.25);
      ground.material = groundMat;

      // Load 3D Character
      statusText.innerText = "Downloading 3D Model...";
      
      BABYLON.SceneLoader.ImportMeshAsync("", "./", "Superhero_Male_FullBody.gltf", scene, function (evt) {
        if (evt.lengthComputable) {
          const loadedPercent = ((evt.loaded * 100) / evt.total).toFixed(0);
          statusText.innerText = "Loading Model: " + loadedPercent + "%";
        }
      })
      .then((result) => {
        statusText.innerText = "Character Loaded Successfully!";
        statusText.style.color = "#00ff00";

        const character = result.meshes[0];
        character.position = new BABYLON.Vector3(0, 0, 0);
        character.scaling = new BABYLON.Vector3(1, 1, 1);
        camera.target = new BABYLON.Vector3(0, 1, 0);
      })
      .catch((err) => {
        const detail = err && err.message ? err.message : JSON.stringify(err);
        statusText.innerText = "Error: " + detail;
        statusText.style.color = "#ff4444";
        console.error("Loading Error:", err);
      });

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(function () {
      scene.render();
    });

    window.addEventListener("resize", function () {
      engine.resize();
    });
  </script>
</body>
</html>
